version: "3.9"

services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://trophy_user:trophy_pass@db:5432/trophy_db
      JWT_SECRET_KEY: dev-secret-key-change-in-production
      UPLOAD_DIR: /app/uploads
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./uploads:/app/uploads

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: trophy_user
      POSTGRES_PASSWORD: trophy_pass
      POSTGRES_DB: trophy_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trophy_user"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
